name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHONPATH: apps/api/src:services/agent-worker/src:services/learning-worker/src:packages/core/src

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install "pytest>=8,<9"
      - name: Compile check
        run: python -m compileall apps/api/src services/agent-worker/src services/learning-worker/src packages/core/src migrations
      - name: Dependency check
        run: pip check
      - name: Migration graph (single head)
        run: |
          heads=$(alembic heads | grep -c '(head)')
          echo "Alembic heads: $heads"
          alembic heads
          if [ "$heads" -ne 1 ]; then echo "::error::Expected exactly 1 Alembic head, found $heads"; exit 1; fi
      - name: Tests
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
        run: npm run build
