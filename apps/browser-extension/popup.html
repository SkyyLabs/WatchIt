<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      label { display: block; margin-bottom: 8px; color: #cbd5e1; }
      input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #e2e8f0; }
      button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
      #status { margin-top: 10px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <label for="code">Pairing code</label>
    <input id="code" placeholder="123456" maxlength="12" />
    <button id="pair">Pair device</button>
    <div id="status">Not paired</div>
    <script src="popup.js"></script>
  </body>
</html>
